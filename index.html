<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#184d5b"><meta name="description" content="Mon Ressenti — Compagnon SZ, journal personnel hors connexion"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png" type="image/png"><title>Mon Ressenti · Compagnon SZ</title><link rel="stylesheet" href="style.css?v=0.2.19"><style>
/* Analyses compactes : le rapport imprimable conserve ses propres styles */
.mr-analysis-compact{display:flex;flex-direction:column;gap:clamp(7px,1.1vh,13px);height:calc(100dvh - 165px);min-height:0;overflow:hidden}
.mr-analysis-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mr-analysis-top h1{font-size:clamp(20px,2.5vh,28px);margin:0}.mr-analysis-top span{font-size:clamp(10px,1.4vh,13px);color:#61787d;text-align:right}
.mr-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mr-metric{background:white;border-radius:14px;padding:clamp(8px,1.3vh,15px);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;box-shadow:0 1px 8px #143e4410}
.mr-metric span{font-size:clamp(11px,1.5vh,16px);color:#5c777b}.mr-metric strong{font-size:clamp(23px,3.4vh,36px);color:#137e81}.mr-metric small{font-size:clamp(10px,1.4vh,14px);color:#61787d}
.mr-analysis-chart{background:white;border-radius:14px;padding:clamp(9px,1.4vh,17px);flex:1;min-height:0;display:flex;flex-direction:column;box-shadow:0 1px 8px #143e4410}
.mr-analysis-chart h2{margin:0 0 6px;font-size:clamp(15px,2vh,21px)}.mr-analysis-chart h2 small{font-size:clamp(10px,1.4vh,13px);font-weight:400;color:#61787d;display:block}
.mr-compact-bars{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:clamp(3px,1vw,12px);flex:1;min-height:50px}
.mr-bar-col{display:flex;flex-direction:column;align-items:center;min-width:0;min-height:0}.mr-bar-col b{height:18px;font-size:clamp(9px,1.2vh,12px);color:#496d71;font-weight:500}.mr-bar-col small{font-size:clamp(10px,1.5vh,14px);margin-top:3px}
.mr-bar-track{flex:1;min-height:0;width:100%;max-width:46px;background:#e8f1f1;border-radius:4px 4px 0 0;display:flex;align-items:flex-end;overflow:hidden}.mr-bar-track i{display:block;background:#178c83;width:100%;border-radius:4px 4px 0 0}
.mr-analysis-report{background:white;border-radius:14px;padding:clamp(8px,1.3vh,15px);display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 8px #143e4410}.mr-analysis-report strong{display:block;font-size:clamp(12px,1.8vh,18px)}.mr-analysis-report small{display:block;font-size:clamp(10px,1.3vh,13px);color:#61787d}.mr-analysis-report .button{white-space:nowrap;font-size:clamp(11px,1.5vh,15px);padding:9px 12px}
.mr-analysis-disclaimer{font-size:clamp(9px,1.2vh,12px);color:#61787d;margin:0}
@media(max-height:650px){.mr-analysis-compact{height:calc(100dvh - 140px);gap:5px}.mr-metric{padding:5px 8px}.mr-analysis-chart{padding:6px 9px}.mr-analysis-report{padding:6px 9px}}
@media(max-width:400px){.mr-analysis-top span{max-width:45%}.mr-analysis-report{gap:6px}.mr-analysis-report .button{padding:8px}}
</style></head><body><div id="app"><header><div class="brand"><img class="logo" src="icon-192.png" alt="Icône Mon Ressenti"><div><strong>Mon Ressenti</strong><small>Compagnon SZ · v0.2.20</small></div></div><span class="local">● Local</span></header><main id="screen"></main><nav id="nav" aria-label="Navigation principale"><button data-page="home">⌂<span>Accueil</span></button><button data-page="new">＋<span>Saisir</span></button><button data-page="journal">▦<span>Journal</span></button><button data-page="stats">▥<span>Analyses</span></button><button data-page="settings">⚙<span>Réglages</span></button></nav></div><script src="report.js?v=0.2.19" defer></script><script src="app.js?v=0.2.19" defer></script></body></html>
